<mat-sidenav-container class="sidenav-container">

    <mat-sidenav #sidenav mode="side" opened class="sidenav">
        <!-- Header del sidenav -->
        <div class="sidenav-header">
            <div class="logo">
                <mat-icon class="logo-icon">pets</mat-icon>
                <span class="logo-text">Veterinaria Patitas</span>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="sidenav-nav">
            <!-- Dashboard -->
            <a routerLinkActive="active" class="nav-item">
                <mat-icon>dashboard</mat-icon>
                <span>Dashboard</span>
            </a>

            <!-- Clientes -->
            <a routerLinkActive="active" class="nav-item">
                <mat-icon>people</mat-icon>
                <span>Clientes</span>
            </a>

            <!-- Agenda -->
            <a routerLinkActive="active" class="nav-item on">
                <mat-icon>event</mat-icon>
                <span>Agenda</span>
            </a>

            <!-- Productos -->
            <a routerLinkActive="active" class="nav-item">
                <mat-icon>inventory_2</mat-icon>
                <span>Productos</span>
            </a>


            <a routerLinkActive="active" class="nav-item">
                <mat-icon>receipt_long</mat-icon>
                <span>Facturas</span>
            </a>


            <a routerLinkActive="active" class="nav-item">
                <mat-icon>shopping_cart</mat-icon>
                <span>Ventas</span>
            </a>


            <a routerLinkActive="active" class="nav-item">
                <mat-icon>assessment</mat-icon>
                <span>Reportes</span>
            </a>

            <mat-divider class="my-3"></mat-divider>


            <a routerLinkActive="active" class="nav-item">
                <mat-icon>settings</mat-icon>
                <span>Configuración</span>
            </a>

         
            <a routerLinkActive="active" class="nav-item"    (click)="logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Salir</span>
            </a>
        </nav>

        <!-- Footer del sidenav -->
        <div class="sidenav-footer">
            <div class="user-info">
                <div class="user-avatar">
                    <mat-icon>account_circle</mat-icon>
                </div>
                <div class="user-details">
                    <div class="user-name">Juan Pérez</div>
                    <div class="user-role">Administrador</div>
                </div>
            </div>
        </div>
    </mat-sidenav>

    <mat-sidenav-content>

        <mat-toolbar color="primary">
            <button mat-icon-button (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
            </button>
            <span>Citas programadas</span>
        </mat-toolbar>

        <router-outlet></router-outlet>

    </mat-sidenav-content>
</mat-sidenav-container>
